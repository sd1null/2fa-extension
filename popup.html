<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            width: 360px;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: 16px;
            margin: 0 0 15px 0;
            color: #ffffff;
        }
        .account-card {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
        }
        .account-name {
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .account-code {
            font-size: 26px;
            font-weight: 700;
            color: #2f80ed;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            user-select: all;
            cursor: pointer;
        }
        .timer-text {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            color: #666;
            font-weight: bold;
        }
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #2f80ed;
            width: 100%;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <h1>🔐 2FA Authenticator</h1>
    <div id="auth-cards"></div>
    <script src="popup.js"></script>
</body>
</html>

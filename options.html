<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <img src="icons/icon48.png" style="width: 32px; height: 32px; margin-right: 15px;">
        <h2 style="margin: 0; padding: 0; border: none;">Настройки 2FA</h2>
    </div>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px;}
        input {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: #2f80ed;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #266dd3; }
        .account-list { margin-top: 30px; }
        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #333;
        }
        .btn-delete { background: #eb5757; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #cf4040; }
    </style>
</head>
<body>
    <h2>➕ Добавить новый 2FA аккаунт</h2>
    <div class="form-group">
        <label>Название сервиса (например, GitHub):</label>
        <input type="text" id="name" placeholder="GitLab-Work">
    </div>
    <div class="form-group">
        <label>Секретный ключ (Secret Key в Base32):</label>
        <input type="text" id="secret" placeholder="JBSWY3DPEHPK3PXP">
    </div>
    <button id="add-btn">Сохранить аккаунт</button>

    <h2>📋 Текущие аккаунты</h2>
    <div id="list" class="account-list"></div>

    <script src="options.js"></script>
</body>
</html>
